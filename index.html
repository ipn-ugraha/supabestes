<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Test</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --border: #1f2d45;
      --accent: #3ecf8e;
      --accent2: #1a7f5a;
      --text: #e2e8f0;
      --muted: #64748b;
      --error: #f87171;
      --warning: #fbbf24;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(62,207,142,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(62,207,142,0.04) 0%, transparent 60%);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 0 0 1px rgba(62,207,142,0.05), 0 24px 64px rgba(0,0,0,0.4);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }

    .logo-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    input::placeholder { color: var(--muted); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0e1a;
    }

    .btn-primary:hover {
      background: #5ce0a5;
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(62,207,142,0.3);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: transparent;
      color: var(--error);
      border: 1px solid rgba(248,113,113,0.3);
    }

    .btn-danger:hover {
      background: rgba(248,113,113,0.1);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-bar {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .status-bar.show { display: flex; }
    .status-bar.loading { background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.2); color: var(--warning); }
    .status-bar.success { background: rgba(62,207,142,0.08); border: 1px solid rgba(62,207,142,0.2); color: var(--accent); }
    .status-bar.error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(251,191,36,0.3);
      border-top-color: var(--warning);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-box {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .result-box.show { display: block; }

    .result-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-count {
      background: rgba(62,207,142,0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
    }

    pre {
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: #94a3b8;
      overflow-x: auto;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    pre::-webkit-scrollbar { width: 6px; height: 6px; }
    pre::-webkit-scrollbar-track { background: transparent; }
    pre::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .tip {
      margin-top: 20px;
      padding: 12px 14px;
      background: rgba(62,207,142,0.04);
      border: 1px solid rgba(62,207,142,0.1);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }

    .tip span { color: var(--accent); }
  </style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="logo-dot"></div>
    <span class="logo-text">Supabase · Connection Test</span>
  </div>

  <h1>Test Koneksi</h1>
  <p class="subtitle">// masukkan kredensial supabase kamu</p>

  <div class="field">
    <label>Project URL</label>
    <input type="text" id="url" placeholder="https://xxxxxxxx.supabase.co" />
  </div>

  <div class="field">
    <label>Anon Key</label>
    <input type="password" id="key" placeholder="eyJhbGci..." />
  </div>

  <div class="field">
    <label>Nama Tabel</label>
    <input type="text" id="tabel" placeholder="nama_tabel" />
  </div>

  <div class="divider"></div>

  <div class="btn-group">
    <button class="btn-primary" onclick="ambilData()">▶ Ambil Data</button>
    <button class="btn-secondary" onclick="testKoneksi()">⚡ Test Koneksi</button>
    <button class="btn-danger" onclick="resetForm()">✕ Reset</button>
  </div>

  <div class="status-bar" id="status">
    <div class="spinner" id="spinner"></div>
    <span id="statusMsg">Menghubungkan...</span>
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-header">
      <span>OUTPUT</span>
      <span class="result-count" id="rowCount"></span>
    </div>
    <pre id="hasil"></pre>
  </div>

  <div class="tip">
    💡 <span>Tip:</span> URL & Anon Key ada di Supabase Dashboard → Settings → API
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;

  function setStatus(type, msg) {
    const bar = document.getElementById('status');
    const msgEl = document.getElementById('statusMsg');
    const spinner = document.getElementById('spinner');
    bar.className = `status-bar show ${type}`;
    msgEl.textContent = msg;
    spinner.style.display = type === 'loading' ? 'block' : 'none';
  }

  function showResult(data) {
    const box = document.getElementById('resultBox');
    const pre = document.getElementById('hasil');
    const count = document.getElementById('rowCount');
    box.classList.add('show');
    pre.textContent = JSON.stringify(data, null, 2);
    if (Array.isArray(data)) {
      count.textContent = `${data.length} baris`;
    } else {
      count.textContent = 'response';
    }
  }

  function getInputs() {
    return {
      url: document.getElementById('url').value.trim(),
      key: document.getElementById('key').value.trim(),
      tabel: document.getElementById('tabel').value.trim()
    };
  }

  async function testKoneksi() {
    const { url, key } = getInputs();
    if (!url || !key) {
      setStatus('error', 'URL dan Anon Key wajib diisi!');
      return;
    }
    setStatus('loading', 'Menguji koneksi...');
    try {
      const db = createClient(url, key);
      const { error } = await db.from('_test_').select('*').limit(1);
      if (error && error.code === '42P01') {
        setStatus('success', '✓ Koneksi berhasil! (tabel _test_ tidak ada, tapi server merespons)');
      } else if (!error) {
        setStatus('success', '✓ Koneksi berhasil!');
      } else {
        setStatus('error', '✗ Error: ' + error.message);
      }
    } catch (e) {
      setStatus('error', '✗ Gagal terhubung: ' + e.message);
    }
  }

  async function ambilData() {
    const { url, key, tabel } = getInputs();
    if (!url || !key) { setStatus('error', 'URL dan Anon Key wajib diisi!'); return; }
    if (!tabel) { setStatus('error', 'Nama tabel wajib diisi!'); return; }

    setStatus('loading', `Mengambil data dari tabel "${tabel}"...`);
    document.getElementById('resultBox').classList.remove('show');

    try {
      const db = createClient(url, key);
      const { data, error } = await db.from(tabel).select('*');
      if (error) {
        setStatus('error', '✗ Error: ' + error.message);
        showResult({ error: error.message });
      } else {
        setStatus('success', `✓ Berhasil! ${data.length} baris ditemukan`);
        showResult(data);
      }
    } catch (e) {
      setStatus('error', '✗ Exception: ' + e.message);
    }
  }

  function resetForm() {
    document.getElementById('url').value = '';
    document.getElementById('key').value = '';
    document.getElementById('tabel').value = '';
    document.getElementById('status').className = 'status-bar';
    document.getElementById('resultBox').classList.remove('show');
    document.getElementById('hasil').textContent = '';
  }
</script>

</body>
</html>
