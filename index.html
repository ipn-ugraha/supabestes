<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Tabel AHI-MTU</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #111827; --surface2: #0f172a;
      --border: #1f2d45; --accent: #3ecf8e; --text: #e2e8f0;
      --muted: #64748b; --error: #f87171;
      --mono: 'JetBrains Mono', monospace; --sans: 'Syne', sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; padding: 32px 24px; }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(62,207,142,0.1); border: 1px solid rgba(62,207,142,0.2); border-radius: 20px; padding: 4px 12px; font-family: var(--mono); font-size: 11px; color: var(--accent); margin-bottom: 10px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    h1 { font-size: 28px; font-weight: 800; }
    h1 span { color: var(--accent); }
    .btn { padding: 10px 20px; border-radius: 7px; border: none; font-family: var(--mono); font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
    .btn-primary { background: var(--accent); color: #0a0e1a; }
    .btn-primary:hover { background: #5ce0a5; }
    .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .config-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: none; }
    .config-card.show { display: block; }
    .config-card .field { margin-bottom: 12px; }
    .config-card label { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .config-card input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; min-width: 140px; }
    .stat-label { font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }
    .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .table-toolbar { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
    .table-title { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .table-title span { color: var(--accent); }
    input[type="text"], input[type="password"] { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 8px 12px; color: var(--text); font-family: var(--mono); font-size: 12px; outline: none; }
    .search-input { width: 220px; }
    .overflow-x { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
    thead tr { background: var(--surface2); border-bottom: 1px solid var(--border); }
    th { padding: 12px 16px; text-align: left; font-size: 10px; color: var(--muted); text-transform: uppercase; font-weight: 600; cursor: pointer; }
    th:hover { color: var(--accent); }
    tbody tr { border-bottom: 1px solid rgba(31,45,69,0.6); }
    tbody tr:hover { background: rgba(62,207,142,0.03); }
    td { padding: 11px 16px; color: #94a3b8; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td:first-child { color: var(--text); font-weight: 600; }
    .status-msg { padding: 12px 16px; border-radius: 8px; font-family: var(--mono); font-size: 12px; margin-bottom: 16px; display: none; }
    .status-msg.show { display: block; }
    .status-msg.error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
    .status-msg.success { background: rgba(62,207,142,0.06); border: 1px solid rgba(62,207,142,0.15); color: var(--accent); }
    .pagination { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); flex-wrap: wrap; gap: 10px; }
    .page-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .page-btn { padding: 5px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: var(--mono); font-size: 11px; cursor: pointer; }
    .page-btn.active { background: var(--accent); color: #0a0e1a; }
    .welcome { padding: 60px 20px; text-align: center; }
    .welcome h2 { font-size: 20px; margin-bottom: 12px; }
    .welcome p { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="badge"><div class="dot"></div> Supabase Viewer</div>
      <h1>Tabel <span>AHI-MTU</span></h1>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" onclick="toggleConfig()">Setting</button>
      <button class="btn btn-primary" onclick="loadData()">Refresh</button>
    </div>
  </div>

  <div class="config-card" id="configCard">
    <div class="field">
      <label>Project URL</label>
      <input type="text" id="urlInput" placeholder="https://xxxxxxxx.supabase.co" />
    </div>
    <div class="field">
      <label>Anon Key</label>
      <input type="password" id="keyInput" placeholder="eyJhbGci..." />
    </div>
    <button class="btn btn-primary" onclick="saveConfig()">Simpan & Load</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="stats-row" id="statsRow" style="display:none">
    <div class="stat"><div class="stat-label">Total Baris</div><div class="stat-value" id="statTotal">0</div></div>
    <div class="stat"><div class="stat-label">Total Kolom</div><div class="stat-value" id="statKolom">0</div></div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <div class="table-toolbar">
      <span class="table-title">Tabel: <span>AHI-MTU</span></span>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari data..." oninput="filterData()" />
    </div>
    <div class="overflow-x" id="tableContainer"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="welcome" id="welcome">
    <h2>Selamat Datang!</h2>
    <p>Isi Project URL & Anon Key untuk mulai melihat data</p>
    <button class="btn btn-primary" onclick="toggleConfig()">Mulai Setup</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var TABLE = 'AHI-MTU';
  var PAGE_SIZE = 20;
  var allData = [];
  var filteredData = [];
  var currentPage = 1;
  var sortAsc = {};
  var db = null;

  function toggleConfig() {
    var card = document.getElementById('configCard');
    card.classList.toggle('show');
    if (card.classList.contains('show')) {
      try {
        document.getElementById('urlInput').value = localStorage.getItem('sb_url') || '';
        document.getElementById('keyInput').value = localStorage.getItem('sb_key') || '';
      } catch(e) {}
    }
  }

  function saveConfig() {
    var url = document.getElementById('urlInput').value.trim();
    var key = document.getElementById('keyInput').value.trim();
    if (!url || !key) { alert('URL dan Key wajib diisi!'); return; }
    try {
      localStorage.setItem('sb_url', url);
      localStorage.setItem('sb_key', key);
    } catch(e) {}
    document.getElementById('configCard').classList.remove('show');
    loadData();
  }

  function setStatus(type, msg) {
    var el = document.getElementById('statusMsg');
    el.className = 'status-msg show ' + type;
    el.textContent = msg;
  }

  function loadData() {
    var url, key;
    try {
      url = localStorage.getItem('sb_url');
      key = localStorage.getItem('sb_key');
    } catch(e) {}

    if (!url || !key) {
      document.getElementById('welcome').style.display = 'block';
      document.getElementById('tableWrap').style.display = 'none';
      setStatus('error', 'Isi Project URL dan Anon Key dulu (klik tombol Setting)');
      return;
    }

    document.getElementById('welcome').style.display = 'none';
    document.getElementById('tableWrap').style.display = 'block';

    try {
      db = supabase.createClient(url, key);
    } catch(e) {
      setStatus('error', 'URL tidak valid: ' + e.message);
      return;
    }

    setStatus('success', 'Memuat data...');

    db.from(TABLE).select('*').then(function(result) {
      if (result.error) {
        setStatus('error', 'Error: ' + result.error.message);
        return;
      }
      allData = result.data || [];
      filteredData = allData.slice();
      currentPage = 1;
      document.getElementById('statTotal').textContent = allData.length.toLocaleString();
      document.getElementById('statKolom').textContent = allData.length > 0 ? Object.keys(allData[0]).length : 0;
      document.getElementById('statsRow').style.display = 'flex';
      setStatus('success', allData.length.toLocaleString() + ' baris dimuat');
      renderTable();
    }, function(err) {
      setStatus('error', 'Gagal: ' + err.message);
    });
  }

  function renderTable() {
    if (allData.length === 0) {
      document.getElementById('tableContainer').innerHTML = '<div style="padding:60px;text-align:center;color:var(--muted);font-family:var(--mono)">Tabel kosong</div>';
      return;
    }
    var headers = Object.keys(allData[0]);
    var thHTML = '';
    for (var i = 0; i < headers.length; i++) {
      thHTML += '<th onclick="sortBy(\'' + headers[i] + '\')">' + headers[i] + '</th>';
    }
    document.getElementById('tableContainer').innerHTML = '<table><thead><tr>' + thHTML + '</tr></thead><tbody id="tableBody"></tbody></table>';
    renderPage();
  }

  function renderPage() {
    var start = (currentPage - 1) * PAGE_SIZE;
    var pageData = filteredData.slice(start, start + PAGE_SIZE);
    var headers = Object.keys(allData[0]);
    var body = document.getElementById('tableBody');
    if (!body) return;

    if (filteredData.length === 0) {
      body.innerHTML = '<tr><td colspan="' + headers.length + '" style="text-align:center;padding:40px;color:var(--muted)">Data tidak ditemukan</td></tr>';
    } else {
      var rows = '';
      for (var i = 0; i < pageData.length; i++) {
        var row = pageData[i];
        var cells = '';
        for (var j = 0; j < headers.length; j++) {
          var val = row[headers[j]];
          var display = (val === null || val === undefined) ? '-' : val;
          cells += '<td>' + display + '</td>';
        }
        rows += '<tr>' + cells + '</tr>';
      }
      body.innerHTML = rows;
    }
    renderPagination();
  }

  function renderPagination() {
    var total = filteredData.length;
    var totalPages = Math.ceil(total / PAGE_SIZE);
    var start = (currentPage - 1) * PAGE_SIZE + 1;
    var end = Math.min(currentPage * PAGE_SIZE, total);
    var el = document.getElementById('pagination');
    if (total === 0) { el.innerHTML = ''; return; }
    var btns = '';
    for (var i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        btns += '<button class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
      } else if (Math.abs(i - currentPage) === 2) {
        btns += '<span style="color:var(--muted);padding:0 4px">...</span>';
      }
    }
    el.innerHTML = '<span>Menampilkan ' + start + '-' + end + ' dari ' + total.toLocaleString() + ' baris</span><div class="page-btns">' + btns + '</div>';
  }

  function goPage(p) { currentPage = p; renderPage(); }

  function filterData() {
    var q = document.getElementById('searchInput').value.toLowerCase();
    filteredData = allData.filter(function(row) {
      var vals = Object.values(row);
      for (var i = 0; i < vals.length; i++) {
        if (String(vals[i] || '').toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    });
    currentPage = 1;
    renderPage();
  }

  function sortBy(col) {
    sortAsc[col] = !sortAsc[col];
    var asc = sortAsc[col];
    filteredData.sort(function(a, b) {
      var va = a[col] || ''; var vb = b[col] || '';
      return asc
        ? String(va).localeCompare(String(vb), undefined, { numeric: true })
        : String(vb).localeCompare(String(va), undefined, { numeric: true });
    });
    currentPage = 1;
    renderPage();
  }

  window.onload = function() {
    var hasConfig = false;
    try {
      hasConfig = !!(localStorage.getItem('sb_url') && localStorage.getItem('sb_key'));
    } catch(e) {}
    if (hasConfig) {
      loadData();
    }
  };
</script>
</body>
</html>
