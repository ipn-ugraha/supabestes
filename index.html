<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Tabel AHI-MTU</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #0f172a;
      --border: #1f2d45;
      --accent: #3ecf8e;
      --text: #e2e8f0;
      --muted: #64748b;
      --error: #f87171;
      --success: #3ecf8e;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Syne', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 32px 24px;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(62,207,142,0.07) 0%, transparent 70%);
    }

    .container { max-width: 1100px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group {}

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(62,207,142,0.1);
      border: 1px solid rgba(62,207,142,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; } 50% { opacity:0.4; }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    h1 span { color: var(--accent); }

    .config-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(62,207,142,0.1);
    }

    input::placeholder { color: var(--muted); }

    .btn {
      padding: 10px 20px;
      border-radius: 7px;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0e1a;
    }

    .btn-primary:hover {
      background: #5ce0a5;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(62,207,142,0.3);
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      min-width: 140px;
    }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-value.muted { color: var(--text); font-size: 14px; }

    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .table-toolbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .table-title span { color: var(--accent); }

    .search-input {
      width: 220px;
      padding: 7px 12px;
      font-size: 12px;
    }

    .overflow-x { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12px;
    }

    thead tr {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }

    th:hover { color: var(--accent); }

    tbody tr {
      border-bottom: 1px solid rgba(31,45,69,0.6);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(62,207,142,0.03); }

    td {
      padding: 11px 16px;
      color: #94a3b8;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    td:first-child { color: var(--text); font-weight: 600; }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 13px;
      display: none;
    }

    .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

    .status-msg {
      padding: 12px 16px;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .status-msg.show { display: block; }
    .status-msg.error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
    .status-msg.loading { background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.15); color: #fbbf24; }
    .status-msg.success { background: rgba(62,207,142,0.06); border: 1px solid rgba(62,207,142,0.15); color: var(--accent); }

    .pagination {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .page-btns { display: flex; gap: 6px; }

    .page-btn {
      padding: 5px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-btn.active { background: var(--accent); color: #0a0e1a; border-color: var(--accent); }

    @media (max-width: 600px) {
      .config-card { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="title-group">
      <div class="badge"><div class="dot"></div> Supabase Viewer</div>
      <h1>Tabel <span>AHI-MTU</span></h1>
    </div>
  </div>

  <div class="config-card">
    <div class="field">
      <label>Project URL</label>
      <input type="text" id="url" placeholder="https://xxxxxxxx.supabase.co" />
    </div>
    <div class="field">
      <label>Anon Key</label>
      <input type="password" id="key" placeholder="eyJhbGci..." />
    </div>
    <button class="btn btn-primary" onclick="loadData()">▶ Load Data</button>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="stats-row" id="statsRow" style="display:none">
    <div class="stat">
      <div class="stat-label">Total Baris</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Kolom</div>
      <div class="stat-value" id="statKolom">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Tabel</div>
      <div class="stat-value muted">AHI-MTU</div>
    </div>
  </div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <div class="table-toolbar">
      <span class="table-title">📋 <span>AHI-MTU</span></span>
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Cari data..." oninput="filterData()" />
    </div>
    <div class="overflow-x">
      <table id="dataTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState">
        <div class="icon">🔍</div>
        Data tidak ditemukan
      </div>
    </div>
    <div class="pagination" id="pagination"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const TABLE = 'AHI-MTU';
  const PAGE_SIZE = 20;

  let allData = [];
  let filteredData = [];
  let currentPage = 1;

  function setStatus(type, msg) {
    const el = document.getElementById('statusMsg');
    el.className = `status-msg show ${type}`;
    el.textContent = msg;
  }

  async function loadData() {
    const url = document.getElementById('url').value.trim();
    const key = document.getElementById('key').value.trim();

    if (!url || !key) { setStatus('error', '⚠️ Project URL dan Anon Key wajib diisi!'); return; }

    setStatus('loading', '⏳ Mengambil data dari tabel ' + TABLE + '...');
    document.getElementById('tableWrap').style.display = 'none';
    document.getElementById('statsRow').style.display = 'none';

    try {
      const db = createClient(url, key);
      const { data, error } = await db.from(TABLE).select('*');

      if (error) {
        setStatus('error', '✗ Error: ' + error.message);
        return;
      }

      allData = data;
      filteredData = data;
      currentPage = 1;

      setStatus('success', `✓ Berhasil! ${data.length} baris dimuat dari tabel ${TABLE}`);

      document.getElementById('statTotal').textContent = data.length;
      document.getElementById('statKolom').textContent = data.length > 0 ? Object.keys(data[0]).length : 0;
      document.getElementById('statsRow').style.display = 'flex';
      document.getElementById('tableWrap').style.display = 'block';

      renderTable();
    } catch(e) {
      setStatus('error', '✗ Gagal: ' + e.message);
    }
  }

  function renderTable() {
    if (allData.length === 0) return;

    const headers = Object.keys(allData[0]);

    // Head
    document.getElementById('tableHead').innerHTML =
      '<tr>' + headers.map(h => `<th onclick="sortBy('${h}')">${h} ↕</th>`).join('') + '</tr>';

    renderPage();
  }

  function renderPage() {
    const start = (currentPage - 1) * PAGE_SIZE;
    const end = start + PAGE_SIZE;
    const pageData = filteredData.slice(start, end);
    const headers = Object.keys(allData[0]);
    const body = document.getElementById('tableBody');
    const empty = document.getElementById('emptyState');

    if (filteredData.length === 0) {
      body.innerHTML = '';
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      body.innerHTML = pageData.map(row =>
        '<tr>' + headers.map(h => `<td title="${row[h] ?? ''}">${row[h] ?? '<span style="color:#334155">null</span>'}</td>`).join('') + '</tr>'
      ).join('');
    }

    renderPagination();
  }

  function renderPagination() {
    const total = filteredData.length;
    const totalPages = Math.ceil(total / PAGE_SIZE);
    const start = (currentPage - 1) * PAGE_SIZE + 1;
    const end = Math.min(currentPage * PAGE_SIZE, total);
    const el = document.getElementById('pagination');

    if (total === 0) { el.innerHTML = ''; return; }

    let btns = '';
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        btns += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 2) {
        btns += `<span style="color:var(--muted);padding:0 4px">...</span>`;
      }
    }

    el.innerHTML = `<span>Menampilkan ${start}–${end} dari ${total} baris</span><div class="page-btns">${btns}</div>`;
  }

  function goPage(p) {
    currentPage = p;
    renderPage();
  }

  function filterData() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filteredData = allData.filter(row =>
      Object.values(row).some(v => String(v ?? '').toLowerCase().includes(q))
    );
    currentPage = 1;
    renderPage();
  }

  let sortAsc = {};
  function sortBy(col) {
    sortAsc[col] = !sortAsc[col];
    filteredData.sort((a, b) => {
      const va = a[col] ?? '';
      const vb = b[col] ?? '';
      return sortAsc[col]
        ? String(va).localeCompare(String(vb), undefined, { numeric: true })
        : String(vb).localeCompare(String(va), undefined, { numeric: true });
    });
    currentPage = 1;
    renderPage();
  }
</script>
</body>
</html>
